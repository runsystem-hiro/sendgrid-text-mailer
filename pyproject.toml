[project]
name = "sendgrid-text-mailer"
version = "0.3.0"
description = "A safe command-line tool for sending personalized plain-text email through SendGrid."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = ["python-dotenv>=1.2.2", "sendgrid>=6.12.5"]

[project.scripts]
sendgrid-text-mailer = "sendgrid_text_mailer.cli:main"

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-cov>=7.1.0", "ruff>=0.16.0"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
